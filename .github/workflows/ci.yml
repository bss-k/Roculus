name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oculus
          POSTGRES_PASSWORD: oculus
          POSTGRES_DB: oculus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oculus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://oculus:oculus@localhost:5432/oculus_test

  # The deploy artifacts: both images build, and the Caddy, nginx and compose configs are valid.
  # All through docker, so no extra npm dependencies.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f api/Dockerfile -t oculus-api:ci .
      - name: Build web image
        run: docker build -f web/Dockerfile -t oculus-web:ci .
      - name: Validate Caddyfile
        # A throwaway hash: caddy validate needs a well-formed one to load the basic_auth block.
        run: |
          HASH=$(docker run --rm caddy:2-alpine caddy hash-password --plaintext ci-only-not-a-secret)
          docker run --rm -e DOMAIN=oculus.example.com -e DASHBOARD_USER=ci -e DASHBOARD_PASSWORD_HASH="$HASH" \
            -v "$PWD/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check nginx config (rendered from the template, as in the web image)
        run: |
          docker run --rm --add-host api:127.0.0.1 -e OCULUS_READ_KEY=ci oculus-web:ci \
            sh -c '/docker-entrypoint.sh nginx -t'
      - name: Validate docker-compose.yml
        run: docker compose --env-file .env.example --profile deploy config --quiet
