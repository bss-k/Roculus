name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oculus
          POSTGRES_PASSWORD: oculus
          POSTGRES_DB: oculus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oculus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://oculus:oculus@localhost:5432/oculus_test
