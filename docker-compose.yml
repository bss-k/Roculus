# Local dev:  docker compose up -d db
# Deploy:     docker compose --profile deploy up -d --build   (reads .env)
#
# In the deploy, Caddy is the only service with public ports. The API and the dashboard are
# reachable only through it, inside the compose network; Postgres only from this machine.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oculus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oculus}
      POSTGRES_DB: oculus
    ports:
      - "127.0.0.1:5432:5432" # loopback only: the database is never exposed publicly
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/test/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oculus"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    profiles: ["deploy"]
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://oculus:${POSTGRES_PASSWORD:-oculus}@db:5432/oculus
      HOST: 0.0.0.0
      PORT: 3000
      # Requests arrive through Caddy (and nginx, for the dashboard), so the client's IP is in
      # X-Forwarded-For. Trusting it is safe only because the API has no published port: every
      # request comes through Caddy, which overwrites whatever X-Forwarded-For the client sent.
      TRUST_PROXY: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s # migrations run before the server starts listening
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["deploy"]
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      # Not `:?` here: compose checks that for every service, even ones whose profile is off.
      # The web container refuses to start without a key instead (web/render-read-keys.sh).
      # Set one of the two: several games, or the older single-game setting.
      OCULUS_READ_KEYS: ${OCULUS_READ_KEYS:-}
      OCULUS_READ_KEY: ${OCULUS_READ_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles: ["deploy"]
    image: caddy:2-alpine
    # Checks the settings below before starting Caddy (clearer errors than Caddy's own).
    entrypoint: ["/bin/sh", "/etc/caddy/start.sh"]
    environment:
      DOMAIN: ${DOMAIN:-}
      DASHBOARD_USER: ${DASHBOARD_USER:-}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:-}
    ports:
      - "80:80" # certificate challenges, and redirects to HTTPS
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/start.sh:/etc/caddy/start.sh:ro
      - caddy_data:/data # certificates: keep them, or every restart asks Let's Encrypt again
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  # Nightly pg_dump into ./backups, keeping 7 days (scripts/backup.sh). Restore: scripts/restore.sh.
  backup:
    profiles: ["deploy"]
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: oculus
      PGPASSWORD: ${POSTGRES_PASSWORD:-oculus}
      PGDATABASE: oculus
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
